<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presupuestos · LR Mantenciones Domiciliaria</title>
<meta name="description" content="Presupuestos en terreno para servicios de mantención domiciliaria.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1B4494">
<link rel="icon" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presupuestos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --paper:#E7EAE3;
  --card:#F5F7F1;
  --white:#FFFFFF;
  --grid:rgba(20,36,58,.075);
  --ink:#14243A;
  --ink-2:#4C5C6E;
  --ink-3:#8B98A5;
  --line:#C6CEC4;
  --line-2:#D9DFD5;
  --hivis:#F5C518;
  --hivis-dk:#CFA30A;
  --brand:#1B4494;
  --brand-2:#D81F26;
  --alert:#B4442E;
  --ok:#2E6B4F;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'Barlow Condensed','Oswald','Arial Narrow',var(--sans);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
#shell{max-width:470px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:env(safe-area-inset-bottom)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}

/* ---------- estructura ---------- */
.topbar{display:flex;align-items:center;gap:9px;padding:14px 16px 12px;
  position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar h1{font-family:var(--cond);font-weight:700;font-size:23px;letter-spacing:.02em;
  text-transform:uppercase;margin:0;flex:1;line-height:1.1;min-width:0}
.topbar .sub{display:block;font-family:var(--sans);font-size:10px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;flex:0 0 auto;
  background:transparent;border:1px solid var(--line);border-radius:4px}
.iconbtn:hover{background:var(--card)}
.iconbtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;border:0;padding:0;
  position:relative;background:transparent}
.dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--ok)}
.dot.ok::after{background:var(--ok);opacity:.55}
.dot.pend::after{background:var(--hivis-dk)}
.dot.error::after{background:var(--alert)}
.dot.error{animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{50%{opacity:.35}}

.screen{padding:16px 16px 40px}
.screen.has-tape{padding-bottom:132px}
.sect{margin:0 0 20px}
.sect-h{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sect-h::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px}
.card + .card{margin-top:10px}

/* ---------- formularios ---------- */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
input[type=text],input[type=number],input[type=tel],input[type=email],select,textarea{
  width:100%;padding:11px 12px;background:var(--white);border:1px solid var(--line);border-radius:4px}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:66px}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
.row{display:flex;gap:10px}
.row > *{flex:1;min-width:0}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 16px;border-radius:4px;border:1px solid var(--ink);
  background:var(--hivis);color:var(--ink);font-family:var(--cond);font-size:17px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;width:100%}
.btn:hover{background:var(--hivis-dk)}
.btn.ghost{background:transparent;border-color:var(--line);font-weight:500}
.btn.ghost:hover{background:var(--card)}
.btn.danger{background:transparent;border-color:var(--alert);color:var(--alert)}
.btn.danger:hover{background:rgba(180,68,46,.07)}
.btn.wa{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.wa:hover{background:#153672}
.btn.sm{padding:9px 12px;font-size:14px}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.btnrow{display:flex;gap:8px}

.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--white)}
.seg button{flex:1;padding:9px 4px;background:transparent;border:0;border-right:1px solid var(--line);
  font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--white)}

/* ---------- lista de presupuestos ---------- */
.quote{display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:8px}
.quote:hover{border-color:var(--ink)}
.quote .qtop{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.qnum{font-family:var(--cond);font-size:13px;font-weight:600;letter-spacing:.09em;color:var(--ink-3)}
.qname{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbot{display:flex;align-items:center;gap:8px;justify-content:space-between}
.qdesc{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qtotal{font-family:var(--cond);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid currentColor}
.st-borrador{color:var(--ink-3)}
.st-enviado{color:var(--ink)}
.st-aprobado{color:var(--ok);background:rgba(46,107,79,.09)}
.st-rechazado{color:var(--alert)}

/* ---------- buscador / chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mchip{background:var(--white);border:1px solid var(--line);border-radius:3px;
  padding:7px 10px;font-size:12.5px;font-weight:500;text-align:left}
.mchip:hover{border-color:var(--ink);background:var(--hivis)}
.mchip.plt{border-color:var(--brand);color:var(--brand);font-weight:600}
.mchip.plt:hover{background:var(--brand);color:#fff}
.results{margin-top:8px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--white)}
.result{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;
  background:transparent;border:0;border-bottom:1px solid var(--line-2);text-align:left}
.result:last-child{border-bottom:0}
.result:hover{background:var(--hivis)}
.result .rn{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result .rp{font-family:var(--cond);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.result .ru{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}

/* ---------- líneas ---------- */
.line{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:11px 12px;margin-bottom:8px}
.line.srv{border-left:3px solid var(--brand)}
.line-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px}
.line-name{flex:1;font-size:14.5px;font-weight:600;line-height:1.3}
.line-unit{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;font-weight:500;margin-top:2px}
.xbtn{width:26px;height:26px;flex:0 0 auto;display:grid;place-items:center;
  background:transparent;border:1px solid var(--line);border-radius:3px;color:var(--ink-3)}
.xbtn:hover{color:var(--alert);border-color:var(--alert)}
.xbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.line-nums{display:flex;align-items:flex-end;gap:8px}
.numwrap{flex:1;min-width:0}
.numwrap label{font-size:9.5px;letter-spacing:.1em;margin-bottom:3px}
.numwrap input{padding:8px 9px;font-size:14px}
.line-total{font-family:var(--cond);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;
  white-space:nowrap;padding-bottom:7px;min-width:82px;text-align:right}

/* ---------- resumen interno ---------- */
.calc-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13.5px}
.calc-row span:last-child{font-variant-numeric:tabular-nums;font-weight:500}
.calc-row.strong{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:600}
.calc-row.neg span:last-child{color:var(--alert)}
.private{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  border:1px dashed var(--line);border-radius:3px;padding:3px 7px;margin-bottom:9px}
.private svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- cinta métrica ---------- */
.tape{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:470px;margin:0 auto;
  background:var(--hivis);border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.tape-ticks{height:13px;
  background-image:
    repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 48px),
    repeating-linear-gradient(90deg,rgba(20,36,58,.55) 0 1px,transparent 1px 9.6px);
  background-size:100% 13px,100% 6px;background-repeat:repeat-x,repeat-x;
  background-position:top left,top left}
.tape-body{display:flex;align-items:center;gap:12px;padding:4px 14px 12px}
.tape-l{flex:1;min-width:0}
.tape-lab{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(20,36,58,.65)}
.tape-num{font-family:var(--cond);font-size:33px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;margin-top:1px}
.tape-btn{flex:0 0 auto;padding:11px 15px;background:var(--ink);color:var(--hivis);border:0;
  border-radius:4px;font-family:var(--cond);font-size:16px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase}
.tape-btn:hover{background:#0B1729}

/* ---------- documento ---------- */
.doc-actions{padding:14px 16px 0}
.docwrap{padding:16px}
.doc{background:var(--white);border:1px solid var(--line);padding:26px 24px 30px;
  box-shadow:0 1px 0 var(--line-2)}
.doc-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;
  border-bottom:2px solid var(--brand);padding-bottom:14px;margin-bottom:16px}
.doc-ident{display:flex;align-items:flex-start;gap:12px;min-width:0}
.doc-logo{width:58px;height:58px;object-fit:contain;flex:0 0 auto;margin-top:1px}
.doc-emp{font-family:var(--cond);font-size:25px;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;line-height:1.05;margin:0 0 5px;color:var(--brand)}
.doc-meta{font-size:11.5px;color:var(--ink-2);line-height:1.65}
.doc-nlab{font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);text-align:right}
.doc-n{font-family:var(--cond);font-size:27px;font-weight:700;line-height:1;text-align:right;
  color:var(--brand);font-variant-numeric:tabular-nums;white-space:nowrap}
.doc-date{font-size:11px;color:var(--ink-2);text-align:right;margin-top:5px;line-height:1.5}
.doc-block{margin-bottom:16px}
.doc-lab{font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:4px}
.doc-cli{font-size:15px;font-weight:600}
.doc-cli-x{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.doc-desc{font-size:13.5px;line-height:1.6;white-space:pre-wrap}

table.doc-t{width:100%;border-collapse:collapse;margin:6px 0 0}
table.doc-t th{font-size:9px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:0 0 6px;border-bottom:1px solid var(--brand)}
table.doc-t th.r,table.doc-t td.r{text-align:right}
table.doc-t td{padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:top}
table.doc-t td.r{font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
table.doc-t .tu{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
table.doc-t tr.grp td{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--brand);padding:12px 0 4px;border-bottom:0}
table.doc-t tr.grp:first-child td{padding-top:6px}

.doc-tot{margin-top:14px;margin-left:auto;width:100%;max-width:290px}
.doc-tot .tr{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:5px 0}
.doc-tot .tr span:last-child{font-variant-numeric:tabular-nums}
.doc-tot .tr.desc span{color:var(--brand-2)}
.doc-tot .grand{display:flex;justify-content:space-between;gap:14px;align-items:baseline;
  border-top:2px solid var(--brand);margin-top:7px;padding-top:9px}
.doc-tot .grand .gl{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.doc-tot .grand .gv{font-family:var(--cond);font-size:29px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums}
.doc-foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line-2);
  font-size:11.5px;color:var(--ink-2);line-height:1.65;white-space:pre-wrap}

/* ---------- catálogo ---------- */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:0 0 16px}
.tabs button{flex:1;padding:11px 4px;background:transparent;border:0;border-bottom:2px solid transparent;
  font-family:var(--cond);font-size:15px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3)}
.tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--hivis-dk)}
.mat{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:4px;margin-bottom:7px}
.mat.srv{border-left:3px solid var(--brand)}
.mat-n{flex:1;min-width:0}
.mat-n b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-n span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.mat input{width:98px;padding:8px 9px;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.catname{font-family:var(--cond);font-size:16px;font-weight:600;text-transform:uppercase;
  letter-spacing:.09em;color:var(--ink-2);margin:18px 0 8px}
.catname:first-child{margin-top:0}

.empty{text-align:center;padding:34px 18px;border:1px dashed var(--line);border-radius:4px;background:var(--card)}
.empty p{margin:0 0 14px;color:var(--ink-2);font-size:14px;line-height:1.55}
.note{font-size:12px;color:var(--ink-2);line-height:1.55;margin:0 0 12px}
.inline-form{background:var(--white);border:1px solid var(--ink);border-radius:4px;padding:13px;margin-bottom:10px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--white);padding:10px 16px;border-radius:4px;
  font-size:13px;font-weight:500;box-shadow:0 6px 20px rgba(20,36,58,.28);
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;
  max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  body{background:#fff!important}
  .no-print,.topbar,.tape,.doc-actions,.toast{display:none!important}
  #shell{max-width:none}
  .docwrap{padding:0}
  .doc{border:0;box-shadow:none;padding:0}
  @page{margin:16mm}
}
</style>
</head>
<body>

<div id="shell"><div id="view"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileimp" accept="application/json,.json" style="display:none">

<script>
/* =====================================================================

/* --------------------------- persistencia ---------------------------
   Reglas: nunca se sobrescriben datos existentes por un error de lectura,
   toda escritura se reintenta, y el estado que se muestra es el real.

   La app puede correr en dos lugares y guarda en el que corresponda:
     · dentro del visor de Claude  -> window.storage
     · como archivo en tu PC o celular -> almacenamiento del navegador
   Si ninguno está disponible, funciona en memoria y avisa que no persiste. */
const Store = (function(){
  const P = v => Promise.resolve(v);

  if(window.storage && window.storage.get && window.storage.set){
    return {
      modo:'claude', nombre:'la app de Claude',
      list: p     => window.storage.list(p),
      get:  k     => window.storage.get(k),
      set:  (k,v) => window.storage.set(k,v)
    };
  }
  try{
    const LS = window.localStorage;
    const probe = '__ppto_probe__';
    LS.setItem(probe,'1');
    if(LS.getItem(probe) !== '1') throw new Error('no persiste');
    LS.removeItem(probe);
    return {
      modo:'local', nombre:'este navegador',
      list: p     => P({keys: Object.keys(LS).filter(k => k.indexOf(p) === 0)}),
      get:  k     => { const v = LS.getItem(k); return P(v === null ? null : {key:k, value:v}); },
      set:  (k,v) => { LS.setItem(k,v); return P({key:k, value:v}); },
      setSync: (k,v) => LS.setItem(k,v)
    };
  }catch(e){ /* sin almacenamiento del navegador */ }

  const M = new Map();
  return {
    modo:'memoria', nombre:'la memoria (no permanente)',
    list: p     => P({keys:[...M.keys()].filter(k => k.indexOf(p) === 0)}),
    get:  k     => P(M.has(k) ? {key:k, value:M.get(k)} : null),
    set:  (k,v) => { M.set(k,v); return P({key:k, value:v}); },
    setSync: (k,v) => M.set(k,v)
  };
})();

const REINTENTOS = [400, 1200, 3000];
const espera = ms => new Promise(r => setTimeout(r, ms));

async function listarClaves(){
  const r = await Store.list('ppto:');
  if(!r || !Array.isArray(r.keys)) throw new Error('sin listado');
  return r.keys.map(k => typeof k === 'string' ? k : (k && k.key) || '');
}
async function leerClave(key){
  let err;
  for(let i = 0; i <= REINTENTOS.length; i++){
    try{
      const r = await Store.get(key);
      if(!r || !r.value) return null;
      return JSON.parse(r.value);
    }catch(e){
      err = e;
      if(i < REINTENTOS.length) await espera(REINTENTOS[i]);
    }
  }
  throw err || new Error('no se pudo leer ' + key);
}
async function escribirClave(key, value){
  for(let i = 0; i <= REINTENTOS.length; i++){
    try{ await Store.set(key, JSON.stringify(value)); return true; }
    catch(e){ if(i < REINTENTOS.length) await espera(REINTENTOS[i]); }
  }
  return false;
}

/* Guardado diferido: agrupa los cambios mientras se escribe y guarda medio
   segundo después. Además guarda de inmediato al salir de un campo, al
   minimizar la app y al cerrarla. */
const DATA = { [K.set]:()=>S, [K.mat]:()=>MAT, [K.srv]:()=>SRV, [K.plt]:()=>PLT, [K.doc]:()=>DOCS };
const pending = new Set();
const tick = {};
let flushT = null, guardando = false, estado = 'ok';

function updateDot(){
  const d = document.getElementById('dot');
  if(!d) return;
  d.className = 'dot ' + estado;
  d.title = estado === 'ok'   ? 'Todo guardado'
          : estado === 'pend' ? 'Guardando…'
          : 'No se pudo guardar. Toca para reintentar.';
}
function setEstado(e){ estado = e; updateDot(); }

function queueSave(...keys){
  keys.forEach(k => { pending.add(k); tick[k] = (tick[k] || 0) + 1; });
  if(estado !== 'error') setEstado('pend');
  clearTimeout(flushT);
  flushT = setTimeout(flushSaves, 500);
}
async function flushSaves(){
  clearTimeout(flushT); flushT = null;
  if(!pending.size){ if(estado !== 'error') setEstado('ok'); return; }
  if(guardando){ flushT = setTimeout(flushSaves, 250); return; }

  guardando = true;
  if(estado !== 'error') setEstado('pend');
  const fallidas = [];
  for(const k of [...pending]){
    const t = tick[k];
    const ok = await escribirClave(k, DATA[k]());
    if(ok){ if(tick[k] === t) pending.delete(k); }
    else fallidas.push(k);
  }
  guardando = false;

  if(fallidas.length){
    setEstado('error');
    clearTimeout(flushT);
    flushT = setTimeout(flushSaves, 6000);   // sigue reintentando solo
  }else if(pending.size){
    setEstado('pend');
    clearTimeout(flushT);
    flushT = setTimeout(flushSaves, 250);
  }else{
    setEstado('ok');
  }
}
function saveNow(...keys){
  keys.forEach(k => { pending.add(k); tick[k] = (tick[k] || 0) + 1; });
  clearTimeout(flushT);
  return flushSaves();
}

/* Guardado sincrónico de emergencia: en el navegador se puede escribir de
   golpe al cerrar la pestaña, cosa que una escritura asíncrona no alcanza. */
function flushSync(){
  if(!pending.size || !Store.setSync) return;
  for(const k of [...pending]){
    try{ Store.setSync(k, JSON.stringify(DATA[k]())); pending.delete(k); }catch(e){}
  }
  updateDot();
}

/* Momentos en que hay que asegurar el guardado en un celular */
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ flushSaves(); flushSync(); } });
window.addEventListener('pagehide',     ()=>{ flushSaves(); flushSync(); });
window.addEventListener('blur',         ()=>{ flushSaves(); });
window.addEventListener('beforeunload', ()=>{ flushSaves(); flushSync(); });
document.addEventListener('focusout', e => {
  const t = e.target;
  if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && pending.size) flushSaves();
});

async function boot(){
  pantallaCarga('Cargando…');

  /* Primero se averigua qué existe. Si esto falla, no sabemos si hay datos
     guardados y por lo tanto NO se siembra ni se escribe nada. */
  let claves;
  try{ claves = await listarClaves(); }
  catch(e){ return pantallaError('No se pudo consultar el almacenamiento.'); }
  const hay = k => claves.includes(k);

  let s, m, sv, pl, d;
  try{
    [s, m, sv, pl, d] = await Promise.all([
      hay(K.set) ? leerClave(K.set) : null,
      hay(K.mat) ? leerClave(K.mat) : null,
      hay(K.srv) ? leerClave(K.srv) : null,
      hay(K.plt) ? leerClave(K.plt) : null,
      hay(K.doc) ? leerClave(K.doc) : null,
    ]);
  }catch(e){
    return pantallaError('Hubo un problema de conexión al leerlos.');
  }

  S    = Object.assign({}, DEF_SET, s || {});
  DOCS = d || [];
  MAT  = (m && m.length)  ? m  : seedFrom(SEED_MAT);
  SRV  = (sv && sv.length) ? sv : seedFrom(SEED_SRV);
  PLT  = pl || seedPlantillas();

  /* Solo se escribe lo que realmente cambió en este arranque */
  const escribir = [];
  if(!m  || !m.length)  escribir.push(K.mat);
  if(!sv || !sv.length) escribir.push(K.srv);
  if(!pl)               escribir.push(K.plt);

  const versionVieja = s ? s.ver : null;
  if(!s || versionVieja !== 3){
    if(versionVieja !== 2 && versionVieja !== 3) S.validezDias = 14;
    const ivaViejo = !!(s && s.iva === true);
    DOCS.forEach(p => {
      if(p.iva === undefined) p.iva = (versionVieja === 2 ? false : ivaViejo);
      if(p.descuento === undefined) p.descuento = 0;
      (p.items || []).forEach(i => { if(!i.tipo) i.tipo = 'mat'; });
    });
    delete S.iva;
    S.ver = 3;
    escribir.push(K.set);
    if(DOCS.length) escribir.push(K.doc);
  }

  DOCS.forEach(p => {
    if(p.descuento === undefined) p.descuento = 0;
    if(p.iva === undefined) p.iva = false;
    (p.items || []).forEach(i => { if(!i.tipo) i.tipo = 'mat'; });
  });

  ready = true;
  if(escribir.length) await saveNow(...escribir);
  else setEstado('ok');
  render();
}

/* --------------------------- cálculo ---------------------------
   El margen se calcula sobre el costo total y se reparte dentro de los
   precios que ve el cliente, para que el documento cuadre exacto y no
   exponga el margen. El descuento se aplica después, sobre el subtotal. */
function calc(p){
  const items = p.items || [];
  const sum = a => a.reduce((x,i) => x + num(i.cantidad)*num(i.precio), 0);
  const mats = items.filter(i => i.tipo !== 'srv');
  const srvs = items.filter(i => i.tipo === 'srv');
  const matBase = sum(mats), srvBase = sum(srvs);

  const mo = p.manoObra || {};
  let moBase = 0;
  if(mo.modo === 'hh')       moBase = num(mo.horas) * num(mo.valorHora);
  else if(mo.modo === 'pct') moBase = matBase * num(mo.pct) / 100;
  else                       moBase = num(mo.monto);

  const gaBase = num(p.gastos);
  const costo = matBase + srvBase + moBase + gaBase;

  const f = 1 + num(p.margenPct)/100;
  const lines = items.map(i => {
    const pu = Math.round(num(i.precio) * f);
    return { ...i, pu, tot: Math.round(pu * num(i.cantidad)) };
  });
  const linesSrv = lines.filter(i => i.tipo === 'srv');
  const linesMat = lines.filter(i => i.tipo !== 'srv');
  const docSrv = linesSrv.reduce((a,i) => a + i.tot, 0);
  const docMat = linesMat.reduce((a,i) => a + i.tot, 0);
  const docMo  = Math.round(moBase * f);
  const docGa  = Math.round(gaBase * f);

  const bruto = docSrv + docMat + docMo + docGa;
  const desc  = Math.min(Math.round(num(p.descuento)), bruto);
  const neto  = bruto - desc;
  const iva   = p.iva ? Math.round(neto * 0.19) : 0;

  return { matBase, srvBase, moBase, gaBase, costo,
           lines, linesSrv, linesMat, docSrv, docMat, docMo, docGa,
           bruto, desc, neto, iva, total: neto + iva, margen: neto - costo };
}

function waTexto(p){
  const c = calc(p);
  const L = [];
  L.push('*PRESUPUESTO N° ' + nnn(p.numero) + '*');
  if(S.empresa) L.push(S.empresa);
  L.push('');
  if(p.cliente.nombre) L.push('Cliente: ' + p.cliente.nombre);
  if(p.cliente.direccion) L.push('Dirección: ' + p.cliente.direccion);
  if(p.descripcion){ L.push(''); L.push(p.descripcion); }
  L.push('');
  if(p.detallado){
    if(c.linesSrv.length){
      L.push('*Servicios*');
      c.linesSrv.forEach(i => L.push('• ' + i.nombre + (num(i.cantidad) !== 1 ? ' × ' + num(i.cantidad).toLocaleString('es-CL') + ' ' + i.unidad : '') + ' — ' + fmt(i.tot)));
      L.push('');
    }
    if(c.linesMat.length){
      L.push('*Materiales*');
      c.linesMat.forEach(i => L.push('• ' + i.nombre + (num(i.cantidad) !== 1 ? ' × ' + num(i.cantidad).toLocaleString('es-CL') + ' ' + i.unidad : '') + ' — ' + fmt(i.tot)));
      L.push('');
    }
  }else{
    if(c.docSrv) L.push('• Servicios — ' + fmt(c.docSrv));
    if(c.docMat) L.push('• Suministro de materiales — ' + fmt(c.docMat));
    L.push('');
  }
  if(c.docMo) L.push('• Mano de obra — ' + fmt(c.docMo));
  if(c.docGa) L.push('• Gastos generales — ' + fmt(c.docGa));
  if(c.desc){ L.push('Subtotal: ' + fmt(c.bruto)); L.push('Descuento: − ' + fmt(c.desc)); }
  if(p.iva){ L.push('Neto: ' + fmt(c.neto)); L.push('IVA 19%: ' + fmt(c.iva)); }
  L.push('*TOTAL: ' + fmt(c.total) + '*');
  L.push('');
  L.push('Válido hasta el ' + fecha(vence(p).toISOString()) + '.');
  if(S.condiciones) L.push(S.condiciones);
  if(S.fono){ L.push(''); L.push(S.empresa + ' · ' + S.fono); }
  return L.join('\n');
}

const CDN_H2C   = './vendor/html2canvas.min.js';
const CDN_JSPDF = './vendor/jspdf.umd.min.js';

function cargarScript(src, listo){
  if(listo()) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => listo() ? res() : rej(new Error('no cargó'));
    s.onerror = () => rej(new Error('sin red'));
    document.head.appendChild(s);
  });
}
function bajarBlob(blob, nombre){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return true;
  }catch(e){ return false; }
}
function nombrePDF(p){
  const cli = norm(p.cliente.nombre || '').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return 'Presupuesto-' + nnn(p.numero) + (cli ? '-' + cli : '') + '.pdf';
}

/* Documento -> PDF tamaño carta A4, cortado en páginas si es largo */
async function generarPDF(){
  await cargarScript(CDN_H2C,   () => !!window.html2canvas);
  await cargarScript(CDN_JSPDF, () => !!(window.jspdf && window.jspdf.jsPDF));

  const el = document.getElementById('docPaper');
  const cv = await window.html2canvas(el, {
    scale: 2, backgroundColor:'#ffffff', useCORS:true, logging:false,
    windowWidth: el.scrollWidth
  });

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
  const PW = pdf.internal.pageSize.getWidth();
  const PH = pdf.internal.pageSize.getHeight();
  const M  = 12;
  const w  = PW - M*2;
  const h  = cv.height * w / cv.width;

  if(h <= PH - M*2){
    pdf.addImage(cv.toDataURL('image/jpeg', 0.94), 'JPEG', M, M, w, h);
  }else{
    const altoPx = Math.floor((PH - M*2) * cv.width / w);
    let y = 0, primera = true;
    while(y < cv.height){
      const corte = Math.min(altoPx, cv.height - y);
      const c2 = document.createElement('canvas');
      c2.width = cv.width; c2.height = corte;
      const ctx = c2.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c2.width, c2.height);
      ctx.drawImage(cv, 0, y, cv.width, corte, 0, 0, cv.width, corte);
      if(!primera) pdf.addPage();
      pdf.addImage(c2.toDataURL('image/jpeg', 0.94), 'JPEG', M, M, w, corte * w / cv.width);
      primera = false; y += corte;
    }
  }
  return pdf.output('blob');
}

async function enviarPDF(p, soloDescargar){
  toast('Generando el PDF…');
  try{
    const blob  = await generarPDF();
    const nombre = nombrePDF(p);
    const file  = new File([blob], nombre, {type:'application/pdf'});

    if(!soloDescargar && navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({
          files:[file],
          title:'Presupuesto N° ' + nnn(p.numero),
          text:'Presupuesto N° ' + nnn(p.numero) + (S.empresa ? ' — ' + S.empresa : '')
        });
        return;
      }catch(err){
        if(err && err.name === 'AbortError') return;   // lo canceló él
        /* si compartir falla, se descarga igual */
      }
    }
    if(bajarBlob(blob, nombre)){
      toast(soloDescargar ? 'PDF descargado' : 'PDF descargado. Adjúntalo en WhatsApp.');
    }else{
      toast('No se pudo crear el archivo. Prueba con Enviar texto.');
    }
  }catch(e){
    toast('No se pudo generar el PDF. Revisa tu conexión y reintenta.');
  }
}
function enviarTexto(p){
  const txt = waTexto(p);
  const url = 'https://wa.me/?text=' + encodeURIComponent(txt);
  const w = window.open(url, '_blank');
  if(!w){
    if(navigator.clipboard) navigator.clipboard.writeText(txt)
      .then(()=>toast('Texto copiado. Pégalo en WhatsApp.'))
      .catch(()=>toast('No se pudo abrir WhatsApp ni copiar.'));
    else toast('No se pudo abrir WhatsApp.');
  }
}

  return topbar('Catálogo', arr.length + (tab==='srv' ? ' servicios' : ' materiales'), true, '') +
  `<div class="screen">${tabs}
    <p class="note">Los precios de partida son referenciales. Cámbialos por los tuyos y quedan guardados.</p>
    <div class="card" style="margin-bottom:14px">
      <div class="sect-h" style="margin-top:0">Agregar ${tab==='srv' ? 'servicio' : 'material'}</div>
      <div class="field"><label for="nm">Nombre</label><input id="nm" type="text" placeholder="${tab==='srv' ? 'Ej: Cambio de cilindro de cerradura' : 'Ej: Perfil metalcon 90 mm'}"></div>
      <div class="row">
        <div class="field"><label for="nc">Categoría</label><select id="nc">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label for="nu">Unidad</label><select id="nu">${unis.map(u=>`<option>${u}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label for="np">Precio</label><input id="np" type="number" step="1" min="0" inputmode="numeric" placeholder="0"></div>
      <button class="btn sm" data-act="addcat" data-tipo="${tab}">${ICO.plus} Agregar al catálogo</button>
    </div>
    <input type="text" placeholder="Buscar…" value="${esc(view.search)}" data-cbusca autocomplete="off">
    <div id="catlist" style="margin-top:14px">${catListHTML()}</div>
  </div>`;
}
function catListHTML(){
  const tab = view.tab;
  const arr = tab === 'srv' ? SRV : MAT;
  const cats = tab === 'srv' ? CATS_SRV : CATS;
  const q = norm(view.search).trim();
  const list = q ? arr.filter(m => norm(m.nombre).includes(q) || norm(m.categoria).includes(q)) : arr;
  let html = '';
  cats.forEach(c => {
    const g = list.filter(m => m.categoria === c);
    if(!g.length) return;
    html += `<div class="catname">${esc(c)}</div>`;
    html += g.map(m => `<div class="mat ${tab==='srv'?'srv':''}">
      <div class="mat-n"><b>${esc(m.nombre)}</b><span>${esc(m.unidad)}</span></div>
      <input type="number" step="1" min="0" inputmode="numeric" value="${m.precio}" data-cat="${tab}" data-id="${m.id}" aria-label="Precio de ${esc(m.nombre)}">
      <button class="xbtn" data-act="delcat" data-tipo="${tab}" data-id="${m.id}" aria-label="Eliminar ${esc(m.nombre)}">${ICO.x}</button>
    </div>`).join('');
  });
  const otras = list.filter(m => !cats.includes(m.categoria));
  if(otras.length){
    html += `<div class="catname">Sin categoría</div>`;
    html += otras.map(m => `<div class="mat ${tab==='srv'?'srv':''}">
      <div class="mat-n"><b>${esc(m.nombre)}</b><span>${esc(m.unidad)}</span></div>
      <input type="number" step="1" min="0" inputmode="numeric" value="${m.precio}" data-cat="${tab}" data-id="${m.id}">
      <button class="xbtn" data-act="delcat" data-tipo="${tab}" data-id="${m.id}">${ICO.x}</button>
    </div>`).join('');
  }
  return html || '<p class="note">Nada con ese nombre.</p>';
}

/* --------------------- respaldo --------------------- */
function respaldoJSON(){
  return JSON.stringify({
    app:'presupuestos', ver:3, fecha:new Date().toISOString(),
    settings:S, materiales:MAT, servicios:SRV, plantillas:PLT, presupuestos:DOCS
  }, null, 2);
}
function exportar(){
  const nombre = 'respaldo-presupuestos-' + new Date().toISOString().slice(0,10) + '.json';
  const blob = new Blob([respaldoJSON()], {type:'application/json'});
  if(bajarBlob(blob, nombre)) toast('Respaldo descargado');
  else toast('No se pudo descargar. Usa Copiar.');
}
function copiarRespaldo(){
  const t = respaldoJSON();
  if(navigator.clipboard) navigator.clipboard.writeText(t)
    .then(()=>toast('Respaldo copiado. Pégalo en un correo o nota.'))
    .catch(()=>toast('No se pudo copiar.'));
  else toast('Este navegador no permite copiar.');
}
async function restaurar(texto){
  let d;
  try{ d = JSON.parse(texto); }
  catch(e){ toast('El archivo no es un respaldo válido.'); return; }
  if(!d || d.app !== 'presupuestos'){ toast('El archivo no es un respaldo de esta app.'); return; }
  const n = (d.presupuestos || []).length;
  if(!confirm('Restaurar el respaldo del ' + fecha(d.fecha) + ' con ' + n + ' presupuesto(s)?\n\nEsto reemplaza todo lo que tienes ahora.')) return;
  S    = Object.assign({}, DEF_SET, d.settings || {});
  MAT  = d.materiales  || [];
  SRV  = d.servicios   || [];
  PLT  = d.plantillas  || [];
  DOCS = d.presupuestos || [];
  DOCS.forEach(p => {
    if(p.descuento === undefined) p.descuento = 0;
    if(p.iva === undefined) p.iva = false;
    (p.items || []).forEach(i => { if(!i.tipo) i.tipo = 'mat'; });
  });
  S.ver = 3;
  await saveNow(K.set, K.mat, K.srv, K.plt, K.doc);
  toast('Respaldo restaurado');
  go('inicio');
}

document.getElementById('fileimp').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => restaurar(String(r.result));
  r.onerror = () => toast('No se pudo leer el archivo.');
  r.readAsText(f);
  e.target.value = '';
});

/* =========================== EVENTOS =========================== */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const act = b.dataset.act;
  const p = view.id ? getDoc(view.id) : null;

  if(act === 'back'){
    if(view.name === 'doc') go('editor', view.id); else go('inicio');
    return;
  }
  if(act === 'cat') return go('cat');
  if(act === 'set') return go('set');
  if(act === 'open') return go('editor', b.dataset.id);
  if(act === 'nuevo'){
    const n = nuevoPpto();
    DOCS.unshift(n); S.correlativo = n.numero + 1;
    saveNow(K.doc, K.set);
    return go('editor', n.id);
  }
  if(act === 'verdoc'){ flushSaves(); return go('doc', view.id); }
  if(act === 'wa-pdf' && p) return enviarPDF(p, false);
  if(act === 'pdf'    && p) return enviarPDF(p, true);
  if(act === 'wa-txt' && p) return enviarTexto(p);
  if(act === 'dot'){
    if(pending.size){ flushSaves(); toast('Guardando…'); }
    else toast('Todo guardado');
    return;
  }
  if(act === 'reintentar'){ boot(); return; }

  if(b.dataset.tab){ view.tab = b.dataset.tab; view.search = ''; return render(); }

  /* ítems */
  if(act === 'add' && p){
    const tipo = b.dataset.tipo;
    const m = cat(tipo).find(x => x.id === b.dataset.id); if(!m) return;
    p.items.push({id:uid(), tipo, refId:m.id, nombre:m.nombre, unidad:m.unidad, cantidad:1, precio:m.precio});
    m.usos = (m.usos||0) + 1;
    const bs = document.getElementById('b-'+tipo); if(bs){ bs.value=''; renderResults(tipo,''); }
    queueSave(K.doc, tipo === 'srv' ? K.srv : K.mat);
    renderItems(); toast(m.nombre + ' agregado'); return;
  }
  if(act === 'libre'){ view.form = {kind:'libre', tipo:b.dataset.tipo}; return render(); }
  if(act === 'form-x'){ view.form = null; return render(); }
  if(act === 'libre-ok' && p){
    const tipo = b.dataset.tipo;
    const nombre = document.getElementById('lfn').value.trim();
    if(!nombre){ toast('Ponle un nombre'); return; }
    const unidad = document.getElementById('lfu').value;
    const precio = num(document.getElementById('lfp').value);
    let refId = null;
    if(document.getElementById('lfsave').checked){
      const nuevo = {id:uid(), nombre, categoria: tipo === 'srv' ? 'General' : 'Otros', unidad, precio, usos:1};
      cat(tipo).push(nuevo); refId = nuevo.id;
      queueSave(tipo === 'srv' ? K.srv : K.mat);
    }
    p.items.push({id:uid(), tipo, refId, nombre, unidad, cantidad:1, precio});
    view.form = null; queueSave(K.doc); render(); toast(nombre + ' agregado'); return;
  }
  if(act === 'del' && p){
    p.items.splice(parseInt(b.dataset.ix,10), 1);
    queueSave(K.doc); renderItems(); return;
  }

  /* plantillas */
  if(act === 'usaplt' && p){
    const t = PLT.find(x => x.id === b.dataset.id); if(!t) return;
    t.lineas.forEach(l => {
      const src = l.refId ? cat(l.tipo).find(x => x.id === l.refId) : null;
      p.items.push({id:uid(), tipo:l.tipo, refId:l.refId || null,
        nombre: src ? src.nombre : l.nombre,
        unidad: src ? src.unidad : l.unidad,
        cantidad: l.cantidad,
        precio: src ? src.precio : l.precio});
    });
    if(!p.descripcion && t.descripcion) p.descripcion = t.descripcion;
    queueSave(K.doc); render();
    toast('Plantilla "' + t.nombre + '" cargada'); return;
  }
  if(act === 'plt'){ view.form = {kind:'plt'}; return render(); }
  if(act === 'plt-ok' && p){
    const nombre = document.getElementById('pfn').value.trim();
    if(!nombre){ toast('Ponle un nombre a la plantilla'); return; }
    PLT.push({ id:uid(), nombre, descripcion:p.descripcion || '',
      lineas: p.items.map(i => ({tipo:i.tipo, refId:i.refId || null, nombre:i.nombre,
                                 unidad:i.unidad, precio:i.precio, cantidad:i.cantidad})) });
    view.form = null; queueSave(K.plt); render();
    toast('Plantilla "' + nombre + '" guardada'); return;
  }
  if(act === 'delplt'){
    const t = PLT.find(x => x.id === b.dataset.id);
    if(t && confirm('¿Eliminar la plantilla "' + t.nombre + '"?')){
      PLT = PLT.filter(x => x.id !== b.dataset.id); saveNow(K.plt); render();
    }
    return;
  }

  /* interruptores */
  if(b.dataset.momodo && p){ p.manoObra.modo = b.dataset.momodo; queueSave(K.doc); return render(); }
  if(b.dataset.estado && p){ p.estado = b.dataset.estado; queueSave(K.doc); return render(); }
  if(b.dataset.detalle && p){ p.detallado = b.dataset.detalle === '1'; queueSave(K.doc); return render(); }
  if(b.dataset.iva && p){ p.iva = b.dataset.iva === '1'; queueSave(K.doc); return render(); }
  if(b.dataset.logo){ S.logo = b.dataset.logo === '1'; queueSave(K.set); return render(); }

  /* duplicar / borrar */
  if(act === 'dup' && p){
    const n = JSON.parse(JSON.stringify(p));
    n.id = uid(); n.numero = S.correlativo; n.fecha = new Date().toISOString(); n.estado = 'Borrador';
    DOCS.unshift(n); S.correlativo = n.numero + 1;
    saveNow(K.doc, K.set); toast('Duplicado como N° ' + nnn(n.numero));
    return go('editor', n.id);
  }
  if(act === 'borrar' && p){
    if(!confirm('¿Eliminar el presupuesto N° ' + nnn(p.numero) + '? No se puede recuperar.')) return;
    DOCS = DOCS.filter(d => d.id !== p.id); saveNow(K.doc); toast('Presupuesto eliminado');
    return go('inicio');
  }

  /* catálogo */
  if(act === 'addcat'){
    const tipo = b.dataset.tipo;
    const nombre = document.getElementById('nm').value.trim();
    if(!nombre){ toast('Ponle un nombre'); return; }
    cat(tipo).push({id:uid(), nombre, categoria:document.getElementById('nc').value,
                    unidad:document.getElementById('nu').value,
                    precio:num(document.getElementById('np').value), usos:0});
    saveNow(tipo === 'srv' ? K.srv : K.mat);
    toast(nombre + ' agregado'); return render();
  }
  if(act === 'delcat'){
    const tipo = b.dataset.tipo;
    const arr = cat(tipo);
    const m = arr.find(x => x.id === b.dataset.id);
    if(m && confirm('¿Eliminar "' + m.nombre + '" del catálogo?')){
      if(tipo === 'srv') SRV = SRV.filter(x => x.id !== b.dataset.id);
      else               MAT = MAT.filter(x => x.id !== b.dataset.id);
      saveNow(tipo === 'srv' ? K.srv : K.mat); render();
    }
    return;
  }

  /* respaldo */
  if(act === 'exp') return exportar();
  if(act === 'exp-copy') return copiarRespaldo();
  if(act === 'imp'){ document.getElementById('fileimp').click(); return; }
  if(act === 'imp-txt'){
    const t = document.getElementById('pegar').value.trim();
    if(!t){ toast('Pega primero el respaldo'); return; }
    return restaurar(t);
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  const p = view.id ? getDoc(view.id) : null;

  if(el.dataset.busca){ renderResults(el.dataset.busca, el.value); return; }
  if(el.dataset.cbusca !== undefined){
    view.search = el.value;
    const box = document.getElementById('catlist');
    if(box) box.innerHTML = catListHTML();
    return;
  }
  if(el.dataset.cat){
    const arr = cat(el.dataset.cat);
    const m = arr.find(x => x.id === el.dataset.id);
    if(m){ m.precio = num(el.value); queueSave(el.dataset.cat === 'srv' ? K.srv : K.mat); }
    return;
  }
  if(el.dataset.s){
    const k = el.dataset.s;
    S[k] = ['valorHora','margenDefecto','validezDias','correlativo'].includes(k) ? num(el.value) : el.value;
    queueSave(K.set); return;
  }
  if(!p) return;
  if(el.dataset.cli){ p.cliente[el.dataset.cli] = el.value; queueSave(K.doc); return; }
  if(el.dataset.p){
    const k = el.dataset.p;
    p[k] = (k === 'descripcion') ? el.value : num(el.value);
    queueSave(K.doc); if(k !== 'descripcion') refreshTotals(); return;
  }
  if(el.dataset.mo){ p.manoObra[el.dataset.mo] = num(el.value); queueSave(K.doc); refreshTotals(); return; }
  if(el.dataset.f){
    const i = p.items[parseInt(el.dataset.ix,10)]; if(!i) return;
    i[el.dataset.f] = num(el.value);
    queueSave(K.doc); refreshTotals(); return;
  }
});

boot();

    navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(()=>{});
